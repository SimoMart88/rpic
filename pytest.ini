[pytest]
pythonpath=src
testpaths=tests
python_files=test_*.py
log_format = %(asctime)s %(levelname)s %(message)s
log_level = CRITICAL
log_cli = False
log_date_format = %Y-%m-%d %H:%M:%S
addopts =
        --reuse-db
        --cov=rpi_controller
        --cov-config=tests/.coveragerc
        --cov-report html
DJANGO_SETTINGS_MODULE = rpi_controller.config.settings
