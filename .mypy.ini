[mypy]
python_version = 3.9
files = src/
install_types = true
show_error_codes = true
strict = true
ignore_missing_imports = True
namespace_packages = true
disable_error_code = misc,
                     no-any-return
mypy_path = "$MYPY_CONFIG_FILE_DIR/src/:"
exclude = (?x)(
    .*\dht\.py
  )

[mypy.plugins.django-stubs]
django_settings_module = "rpi_controller.config.settings"

[mypy-rpi_controller.*]
ignore_missing_imports = True
follow_imports = skip
disable_error_code = type-var,
                     var-annotated,
                     union-attr,
                     attr-defined,
                     unused-ignore

[mypy-strategy_field.*]
ignore_errors = True

[mypy-environ.*]
ignore_errors = True

[mypy-django.*]
ignore_missing_imports = True
