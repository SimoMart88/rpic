exclude: ^$
fail_fast: false
repos:
- hooks:
  - args:
    - check
    - --fix
    entry: ruff
    id: ruff
    language: system
    name: ruff
    stages:
    - pre-commit
    types:
    - python
  repo: local
- hooks:
  - id: mypy
    name: mypy
    entry: mypy
    args:
      - "--config-file"
      - ".mypy.ini"
    language: python
    types:
      - python
    stages:
      - pre-commit
    additional_dependencies:
      - packaging
  repo: local
- hooks:
  - args:
    - --baseline
    - .secrets.baseline
    exclude: (tests/.*|uv.lock)
    id: detect-secrets
    stages:
    - pre-commit
  repo: https://github.com/Yelp/detect-secrets
  rev: v1.5.0
- hooks:
  - args:
      - -c
      - pyproject.toml
      - -b
      - .bandit.baseline
    id: bandit
    stages:
    - pre-commit
    additional_dependencies: ["bandit[toml]"]
  repo: https://github.com/PyCQA/bandit
  rev: 1.8.6
- hooks:
  - id: check-ast
  - id: check-executables-have-shebangs
  - id: check-shebang-scripts-are-executable
    exclude: "(?x)(\n  ^docker/|\n  ^devops/|\n  ^docs/\n)\n"
  - id: name-tests-test
    args:
    - --django
    exclude: ^(tests/test_utils/.*|docs)
  - id: trailing-whitespace
  - id: debug-statements
    stages:
    - pre-commit
  - id: end-of-file-fixer
    exclude: .bumpversion.cfg
    stages:
    - pre-commit
  - id: check-merge-conflict
    stages:
    - pre-commit
  - id: check-case-conflict
    stages:
    - pre-commit
  - id: check-toml
    stages:
    - pre-commit
  repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v4.2.0
- hooks:
  - id: commitizen
  - id: commitizen-branch
    stages:
    - pre-push
  repo: https://github.com/commitizen-tools/commitizen
  rev: v4.0.0
- repo: https://github.com/astral-sh/uv-pre-commit
  rev: 0.8.11
  hooks:
    - id: uv-lock
