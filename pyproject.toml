[project]
name = "rpi-controller"
version = "0.13.0"
description = "A simple and extensible controller for GPIO sensors and actuators on RaspberryPI with web-based management and automation capabilities."
authors = [
  {name = "SimoMart88", email = "simone.martinotti@gmail.com"},
]
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = [
    "django-admin-extra-buttons>=1.5.8",
    "django-bootstrap5>=24.3",
    "django-click>=2.4.0",
    "django-environ>=0.11.2",
    "django-strategy-field>=3.1.0",
    "django>=4.2.16",
    "django-stubs>=5.1.1",
    "django-stubs-ext>=5.1.1",
    "djangorestframework>=3.15.2",
    "django-compressor>=4.5.1",
    "django-celery-beat>=2.8.0",
    "setuptools>=75.6.0",
    "uwsgi>=2.0.28",
    "psycopg>=3.2.3",
    "celery[redis]>=5.5.2",
    "sentry-sdk[django]>=2.32.0",
    "influxdb>=5.3.2",
    "rpi-adafruit-python-dht; platform_machine != 'aarch64'",
    "rpi-gpio>=0.7.1; platform_machine != 'aarch64'",
    "adafruit-circuitpython-dht>=4.0.9; platform_machine == 'aarch64'",
    "lgpio>=0.2.2.0; platform_machine == 'aarch64'",
    "django-redis>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true
dev-dependencies = [
    "factory-boy>=3.3.1",
    "pytest-cov>=6.0.0",
    "pytest-django>=4.9.0",
    "pytest>=8.3.4",
    "types-setuptools>=75.6.0.20241126",
    "django-extensions>=3.2.3",
    "django-webtest>=1.9.12",
    "freezegun>=1.5.1",
    "pytest-selenium>=4.1.0",
    "webdriver-manager>=4.0.2",
    "pytest-randomly>=3.16.0",
]

[tool.uv.sources]
rpi-adafruit-python-dht = { git = "https://github.com/SimoMart88/RPI_Adafruit_Python_DHT" }

[dependency-groups]
checks = [
    "ruff>=0.8.0",
    "commitizen>=4.0.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.1",
    "detect-secrets>=1.5.0",
    "bandit[toml]>=1.8.6",
]
docs = [
    "pygraphviz>=1.11",
]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "pep440"
version_provider = "pep621"
update_changelog_on_bump = true
major_version_zero = true
version_files = [
    "src/rpi_controller/__init__.py:__version__",
]

[tool.bandit]
exclude_dirs = ["tests"]
