[project]
name = "rpi-controller"
version = "0.1.0"
description = "A controller for GPIO sensors and devices on RaspberryPI"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "django-environ>=0.11.2",
    "django>=4.2.16",
    "pytest>=8.3.3",
]

[tool.uv]
dev-dependencies = [
    "commitizen>=4.0.0",
    "pre-commit>=4.0.1",
    "ruff>=0.8.0",
]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "pep440"
version_provider = "pep621"
update_changelog_on_bump = true
major_version_zero = true
