<div>
    <div class="dummy">
        <h1>Dummy Value:</h1>
        <p id="{{ device.slug }}-status-dummy_key">{{ device.status.dummy_key }}</p>
    </div>
    <div class="flag">
        <h5>Flag:</h5>
        <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" role="switch" id="{{ device.slug }}-status-flag" data-updater="update_checkbox" {% if device.status.flag %}checked{% endif %}>
        </div>
    </div>
    <script>
        let flag_field_a_{{ device.id }} = $("#{{ device.slug }}-status-flag");
        flag_field_a_{{ device.id }}.change(function() {
            FieldChangers["change_checkbox"](
                "{{ device.slug }}", flag_field_a_{{ device.id }}, {"flag": flag_field_a_{{ device.id }}.prop('checked')},
                '{% url 'api-actuator-update-status' device.slug %}'
            );
        });
    </script>
</div>
