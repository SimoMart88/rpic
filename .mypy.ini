[mypy]
python_version = 3.9
files = src/
install_types = true
show_error_codes = true
strict = true
ignore_missing_imports = True
namespace_packages = true

[mypy-rpi_controller.*]
ignore_missing_imports = True
follow_imports = skip
disable_error_code = type-var,
                     var-annotated,
                     no-any-return,
                     misc

[mypy-strategy_field.*]
ignore_errors = True

[mypy-environ.*]
ignore_errors = True

[mypy-django.*]
ignore_missing_imports = True
